<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/fatcow/32x32/camera_lens.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darkroom</title>
    <script>
      // Apply the saved UI theme before first paint (see src/store/settings.ts).
      (function () {
        var t = 'auto';
        try {
          var v = localStorage.getItem('darkroom.theme');
          if (v === 'aperture' || v === 'aqua' || v === 'classic' || v === 'auto') t = v;
        } catch (e) {}
        if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'aperture' : 'aqua';
        document.documentElement.setAttribute('data-theme', t);
        // Desktop (Electron) build on macOS: native menu bar + inset traffic lights (see src/native/)
        if (window.darkroomNative && window.darkroomNative.platform === 'darwin') document.documentElement.classList.add('native-mac');
      })();
    </script>
    <style>
      html { background: #d4d0c8; }
      html[data-theme='aperture'] { background: #2b2b2b; }
      html[data-theme='aqua'] { background: #e3e3e3; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
